# GitHub Actions Continuous Integration (CI) Workflow
name: CI

# Trigger workflow on pushes and pull requests to main/develop branches
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Run application tests and linting
  test:
    runs-on: ubuntu-latest
    
    # Run tests on multiple Node.js versions
    strategy:
      matrix:
        node-version: [16.x, 18.x]
    
    steps:
    - uses: actions/checkout@v3 # Clone the repository
    
    # Set up the specified Node.js version
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' # Enable caching for npm dependencies
    
    # Install project dependencies
    - name: Install dependencies
      run: npm ci
    
    # Execute the linter (ESLint)
    - name: Run linter
      run: npm run lint
    
    # Execute unit tests with code coverage report
    - name: Run tests
      run: npm test -- --coverage
    
    # Upload test coverage reports to Codecov (optional third-party tool)
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella

  # Job 2: Build and verify the Docker image (depends on 'test' job)
  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3 # Clone the repository
    
    # Build the application image for testing purposes
    - name: Build Docker image
      run: docker build -t cicd-node-app:test .
    
    # Verify the built image by running a temporary container and checking health
    - name: Test Docker image
      run: |
        docker run -d -p 5000:5000 --name test-app cicd-node-app:test
        sleep 5
        curl -f http://localhost:5000/health || exit 1
        docker stop test-app
